[package]
name = "btm"
version = "3.0.2"
edition = "2024"
keywords = ["vcs", "snapshot", "zfs", "btrfs"]
license = "MIT"
authors = ["hui.fan@mail.ru"]
description = "Blockchain Time Machine"
homepage = "https://github.com/rust-util-collections/btm"
repository = "https://github.com/rust-util-collections/btm"

[dependencies]
ruc = { version = "11.0.3", features = ["cmd", "uau"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
nix = { version = "0.32.0", features = ["fs"] }

clap = { version = "4.6.7", features = ["cargo","derive"], optional = true }

[[bin]]
name = "btm"
path = "src/bins/btm.rs"

[features]
default = ["bin"]
bin = ["clap"]
